# Paths excluded from secret scanning (and push protection).
#
# src/oauth/google-antigravity.ts carries the Antigravity DESKTOP CLIENT's public OAuth
# identifiers, exactly as upstream opencodex publishes them:
#
#   * the file's own docstring says they are "the public OAuth client identifiers embedded in the
#     Antigravity desktop client (overridable via env), not user secrets";
#   * Google's desktop-app guidance is that such a client secret cannot be kept confidential -- it
#     ships inside the installed application;
#   * the identical values are in the published npm tarball (@bitkyc08/opencodex 2.63.0) and in
#     upstream's public repository, so nothing is disclosed by mirroring them here;
#   * operators who want their own credentials set GOOGLE_ANTIGRAVITY_CLIENT_ID and
#     GOOGLE_ANTIGRAVITY_CLIENT_SECRET, which override these defaults.
#
# Excluding the file keeps the fork mirrorable without a per-push bypass prompt. Nothing else in
# this repository contains credentials.
paths-ignore:
  - "src/oauth/google-antigravity.ts"
